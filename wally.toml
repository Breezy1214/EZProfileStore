[package]
name = "breezy1214/ezprofilestore"
description = "A ProfileStore wrapper with generic key-path updates and built-in client replication."
version = "0.1.01"
license = "MIT"
realm = "shared"
registry = "https://github.com/UpliftGames/wally-index"
exclude = [
	"DevPackages",
	"Packages",
	"ServerPackages",
	"docs",
	"tasks",
	"tests",
	"dev.project.json",
	"test.project.json",
	"testez.yml",
	"moonwave.toml",
	"sourcemap.json",
	"rokit.toml",
	"selene.toml",
	"stylua.toml",
]

[dependencies]
Promise = "evaera/promise@4.0.0"
Signal = "sleitnick/signal@2.0.3"
PathWatcher = "breezy1214/pathwatcher@0.1.2"
Fusion = "elttob/fusion@0.3.0"

[server-dependencies]
ProfileStore = "lm-loleris/profilestore@1.0.3"

[dev-dependencies]
TestEZ = "roblox/testez@0.4.1"
