name: Release

# Releases happen when a push to main changes the version in wally.toml.
on:
  push:
    branches: [main]
    paths: [wally.toml]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check
        name: Compare with the previous commit
        run: |
          read_version() {
            sed -n 's/^version = "\(.*\)"/\1/p'
          }
          new=$(read_version < wally.toml)
          old=$(git show "${BEFORE}:wally.toml" 2>/dev/null | read_version || true)
          echo "version=$new" >> "$GITHUB_OUTPUT"

          if [ "$new" = "$old" ]; then
            echo "wally.toml version unchanged ($new); no release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$new" >/dev/null 2>&1; then
            echo "v$new is already tagged; no release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "version $old -> $new; releasing"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          BEFORE: ${{ github.event.before }}

  ci:
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    name: Changelog, Wally, GitHub release
    needs: [check-version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - id: exists
        name: Skip if this version was already released
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add changelog entry
        if: steps.exists.outputs.skip == 'false'
        run: |
          if .github/scripts/changelog.sh has-section "$VERSION"; then
            echo "CHANGELOG.md already has $VERSION"
            exit 0
          fi
          .github/scripts/changelog.sh insert "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: changelog for v$VERSION"
          git push origin HEAD:main

      - name: Check wally.toml matches the release
        if: steps.exists.outputs.skip == 'false'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' wally.toml)
          if [ "$version" != "$VERSION" ]; then
            echo "::error::wally.toml is $version but the release is $VERSION"
            exit 1
          fi

      - name: Publish to Wally
        if: steps.exists.outputs.skip == 'false'
        run: |
          wally login --token "$WALLY_AUTH_TOKEN"
          wally publish
        env:
          WALLY_AUTH_TOKEN: ${{ secrets.WALLY_AUTH_TOKEN }}

      - name: Create GitHub release
        if: steps.exists.outputs.skip == 'false'
        run: |
          .github/scripts/changelog.sh notes "$VERSION" > notes.md
          gh release create "v$VERSION" --target "$(git rev-parse HEAD)" --title "v$VERSION" --notes-file notes.md

  docs:
    name: Deploy docs
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - run: npx --yes moonwave@1 build --code src --out-dir build/docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs

      - id: deploy
        uses: actions/deploy-pages@v5
